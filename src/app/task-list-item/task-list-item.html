@if (task) {


<div class="task-list-item">
    <div class="task-image-container">
        <!-- Using NgOptimizedImage directive to optimize image loading-->
         <!-- ngSrc: directive overrides the original src attribute of an <img> element-->

        <img [ngSrc]="'images/task-' + ((task.id % 2) + 1) + '.png'"
             [alt]="task.taskDescription"
             width="300"
             height="200"
             class="task-image"
             priority="true">
    </div>
    <div class="task-content">
        <div class="task-header">
            <h2 class="task-title">{{ task.taskDescription }}</h2>
            <span class="task-id">#{{ task.id }}</span>
        </div>
        <div class="task-details">
            <div class="detail-row">
                <span class="priority-badge priority-{{ task.taskPriority }}">
                    {{ task.taskPriority | uppercase }}
                </span>
                <span class="detail-item">
                    <i class="icon">📅</i>
                    {{ task.taskDueDate | date:'fullDate' }}
                </span>
                <span class="detail-item">
                    <i class="icon">⏱️</i>
                    {{ task.taskEffort | number:'2.2' }}h
                </span>
            </div>
            <div class="shift-section" *ngIf="task.taskShiftReason">
                <span class="shift-indicator">
                    <i class="icon">🌊</i>
                    Tide Shift: {{ task.taskShiftReason }}
                </span>
            </div>
        </div>
    </div>
</div>

}
