<!-- Add Task Button -->
<div style="margin: 10px 0; text-align: right;">
  <button type="button" (click)="onAdd()">Add Task</button>
</div>

@for (tideNode of tideNodes; track tideNode.taskId; let i = $index) {
  <div class="list-item" 
  [class.even-item]="(i % 2) === 0" 
  [class.odd-item]="(i % 2) === 1"
  (click)="onTaskClick(tideNode)">
  <app-task-list-item [task]="tideNode"></app-task-list-item>

  <!--Edit and Delete Buttons-->
  <button type="button" (click)="onEdit(tideNode)">Edit</button>
  <button type="button" (click)="onDelete(tideNode)">Delete</button>
  </div>
}
