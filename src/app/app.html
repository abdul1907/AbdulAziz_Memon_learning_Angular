<div class="app-container">
    <header class="app-header">
        <h1>🌊 TaskTide</h1>
        <p class="subtitle">Adaptive Workflow Organizer</p>
    </header>
    
    <main class="main-content">
        <div class="top-task">
          <h2>Selected Task:</h2>
          <app-task-list-item [task]="selectedTideNode"></app-task-list-item>
        </div>
        <app-task-list></app-task-list>
    </main>
    
    <footer class="app-footer">
        <textarea class="required-textarea" readonly>This is a Required to be here</textarea>
    </footer>
</div>
