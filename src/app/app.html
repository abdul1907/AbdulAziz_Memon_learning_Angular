<div class="app-container">
    <header class="app-header">
        <h1>🌊 TaskTide</h1>
        <p class="subtitle">Adaptive Workflow Organizer</p>
    </header>
    
    <main class="main-content">
        <div class="top-task">
          <h2>Selected Task:</h2>
          <app-task-list-item [task]="selectedTideNode"></app-task-list-item>
        </div>
        
        <div class="task-list-section">
          <h3 style="text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.3rem;">
            📋 All Tasks - Click any task to select it
          </h3>
          <app-task-list (taskSelected)="onTaskSelected($event)"></app-task-list>
        </div>
    </main>
    
    <footer class="app-footer">
        <textarea class="required-textarea" readonly>This is a Required to be here</textarea>
    </footer>
</div>
